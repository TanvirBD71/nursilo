<header class="public-header" data-chrome>
  <div class="public-header-inner">
    <div class="public-header-brand">
      {% url 'home' as brand_href %}
      {% include "components/site_brand.html" with brand_href=brand_href %}
      <p class="tagline">Learn. Practice. Succeed.</p>
    </div>
    <nav class="public-nav" id="public-primary-nav" aria-label="Product" data-collapsible data-open="false">
      <ul class="public-nav-list">
        <li><a class="public-nav-link" href="#courses">Courses</a></li>
        <li><a class="public-nav-link" href="#practice">Practice</a></li>
        <li><a class="public-nav-link" href="#exams">Exams</a></li>
        <li><a class="public-nav-link" href="#library">Library</a></li>
        <li><a class="public-nav-link" href="#pricing">Pricing</a></li>
      </ul>
    </nav>
    <div class="public-header-actions">
      <a class="public-nav-link" href="{% url 'accounts:login' %}">Login</a>
      <a class="btn btn-primary" href="{% url 'accounts:register' %}">Get Started</a>
      <button
        type="button"
        class="nav-toggle public-nav-toggle"
        data-nav-toggle
        aria-expanded="false"
        aria-controls="public-primary-nav"
        aria-label="Open menu"
        data-closed-label="Open menu"
        data-open-label="Close menu"
      >
        <span class="nav-toggle-icon nav-toggle-icon--menu" aria-hidden="true">{% include "components/icon.html" with name="menu" size="sm" %}</span>
        <span class="nav-toggle-icon nav-toggle-icon--close" hidden aria-hidden="true">{% include "components/icon.html" with name="close" size="sm" %}</span>
        <span data-nav-toggle-text>Menu</span>
      </button>
    </div>
  </div>
</header>
