{% extends "layouts/error.html" %}
{% block title %}Bad request — Nursilo{% endblock %}
{% block content %}
  <div class="error-panel">
    <h1 class="page-title">{{ page_heading }}</h1>
    <p class="page-lede">The request could not be understood. Please try again.</p>
    <div class="action-row">
      {% if user.is_authenticated %}
        <a class="btn btn-primary" href="{% url 'portal:dashboard' %}">Go to dashboard</a>
      {% else %}
        <a class="btn btn-primary" href="{% url 'accounts:login' %}">Sign in</a>
      {% endif %}
      <a class="btn btn-secondary" href="{% url 'home' %}">Home</a>
    </div>
  </div>
{% endblock %}
